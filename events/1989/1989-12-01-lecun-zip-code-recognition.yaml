id: 1989-12-01-lecun-zip-code-recognition
title: LeCun and colleagues train a network to recognize ZIP-code digits
date: "1989-12-01"
summary: >-
  Yann LeCun and six Bell Labs colleagues apply backpropagation through a constrained network to
  classify normalized images of handwritten U.S. ZIP-code digits.
description: |
  LeCun and six colleagues at AT&T Bell Laboratories published the paper in
  *Neural Computation* 1(4), pp. 541–551. They applied backpropagation to a
  network whose architecture encoded task-specific constraints, classifying
  normalized images of handwritten U.S. Postal Service ZIP-code digits. The
  network learned the mapping from each normalized character image to a digit
  class; it did not process an entire envelope or ZIP code end to end.

  Later work extended convolutional character recognition to complete document
  systems. In 1997, Bottou, Bengio and LeCun reported that their globally trained
  check-reading system was commercially deployed, and that it had been fielded
  in a bank in June 1996. Their 1998 review also describes the system and its
  commercial use. These are reports by the system's developers; the papers give
  conflicting check-volume figures, so none is included here.
