id: 2026-06-09-claude-fable-5-mythos-5
title: Anthropic introduces Claude Fable 5 and restricted Mythos 5
date: 2026-06-09
summary: Anthropic released Fable 5 for general use with safety classifiers, alongside Mythos 5, the same underlying model with some safeguards lifted for a small group of Project Glasswing partners.
description: >-
  Anthropic released Claude Fable 5 for general use with classifiers that
  route some high-risk cybersecurity, biology, chemistry, and model-distillation
  requests to Opus 4.8. It also made Claude Mythos 5 available to a small group
  of cyber defenders and infrastructure providers in Project Glasswing; Mythos
  5 is the same underlying model with cyber safeguards lifted. A broader biology
  access program was planned, not yet operating. Anthropic's system card describes
  Mythos 5 as its most capable trained model and reports substantially stronger
  cyber performance than Opus 4.8, while Fable 5 falls back to Opus 4.8 when its
  classifiers trigger. On June 12, after the US government issued an export-control
  directive restricting foreign nationals' access, Anthropic suspended both
  models for all users. By July 1, Fable 5 had returned globally, while Mythos 5 had been restored
  to a limited set of US organizations following US government approval on
  June 26. GitHub also re-enabled Fable 5 in Copilot on July 1.
  {note: Anthropic's launch page has later updates; the suspension and restoration chronology is sourced to its separate June 12 statement, June 30 redeployment post, and GitHub's dated changelog updates.}
category: model release
tags:
