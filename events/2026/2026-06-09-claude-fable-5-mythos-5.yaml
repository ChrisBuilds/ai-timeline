id: 2026-06-09-claude-fable-5-mythos-5
title: Anthropic introduces Claude Fable 5 and restricted Mythos 5
date: 2026-06-09
summary: Anthropic released Fable 5, a Mythos-class model with safeguards for general use, and Mythos 5, the same model with safeguards lifted for approved partners.
description: >-
  Anthropic introduced two configurations of one underlying model on June 9,
  2026. Claude Fable 5 (`claude-fable-5`) was released for general use on the
  Claude API and in Claude subscriptions, with classifiers that route
  high-risk cybersecurity, biology, chemistry, and distillation requests to
  Claude Opus 4.8 instead of refusing them. Anthropic said the fallback
  triggers in less than 5% of sessions on average. Claude Mythos 5 is the same
  model with some safeguards lifted: it was deployed first to existing Claude
  Mythos Preview users, such as Project Glasswing cybersecurity partners, with
  a trusted-access program for biomedical researchers announced as planned
  rather than yet running. It was not generally available. Both models were
  priced at $10 per million input tokens and $50 per million output tokens.
  Anthropic called Fable 5 the most capable model it had made generally
  available and reported state-of-the-art results on nearly all tested
  benchmarks; these are the developer's own comparisons. Its system card
  describes Mythos 5 as the most capable model Anthropic has trained, applies
  ASL-3 protections to Fable 5, and judges the models not to cross the
  automated AI R&D threshold. Access to both models was suspended on June 12
  and restored on July 1, 2026, and GitHub re-enabled Fable 5 in Copilot that
  day.
  {note: Anthropic's announcement page records the suspension and redeployment only as dated sidebar items without a reason, and was modified after launch. This entry describes the June 9 launch and keeps the later chronology separate.}
  {note: The system card was read through its AI R&D section; the cyber, alignment, and capability sections were not read.}
