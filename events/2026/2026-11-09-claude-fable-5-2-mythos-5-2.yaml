id: 2026-11-09-claude-fable-5-2-mythos-5-2
title: Anthropic releases Claude Fable 5.2 and restricted Mythos 5.2
date: 2026-11-09
summary: Anthropic released Claude Fable 5.2 for demanding reasoning and long-running agentic work, alongside Mythos 5.2 for verified organizations.
description: >-
  Anthropic released Claude Fable 5.2 and Claude Mythos 5.2, sharing an
  underlying model with different cybersecurity and biology safeguards.
  Fable was available broadly; Mythos access required organizational
  verification. Anthropic reported Fable 5.2 scoring 49.1% on FrontierCode
  2.0 versus 32.4% for Fable 5.1, and 74.6% on Terminal-Bench-Science 0.1
  versus 52.6%. These are vendor evaluations, not independent replications.
  The API documentation lists a one-million-token context window, a
  128,000-token output limit, and standard prices of $8 per million input
  tokens and $40 per million output tokens. The release continued the
  paired general-access and restricted-access approach used for version 5.1.
