id: 2026-10-07-claude-haiku-5-5
title: Anthropic releases Claude Haiku 5.5
date: 2026-10-07
summary: Anthropic released Claude Haiku 5.5, a low-cost small model aimed at high-volume work, subagents and browser use.
description: >-
  Anthropic released Claude Haiku 5.5 on October 7, 2026, as the third model in
  its Claude 5.5 family, available through the Claude API as `claude-haiku-5-5`
  and on Amazon Web Services, Google Cloud, and Microsoft Azure. It was priced
  at $0.10 per million input tokens and $0.50 per million output tokens for
  requests up to 100,000 tokens, with higher rates above that. Anthropic
  introduced adjustable effort for the first time in a Haiku model and positioned
  it for high-volume, cost-sensitive tasks, including summaries, classification,
  subagent work and browser use. The announcement included evaluations from
  named customers: Asana tested AI Teammate tasks, HubSpot used simulated CRM
  portals, AlphaSense ran 400 queries, and Box tested analytical work. These
  were launch-period tests reported by Anthropic; they do not establish broad or
  sustained use. Anthropic said Sonnet 5.5 and Opus 5.5 remain better for
  complex agentic coding. Artificial Analysis and Vals AI later evaluated the
  model independently across their benchmark suites, with results varying by
  task and effort setting.
