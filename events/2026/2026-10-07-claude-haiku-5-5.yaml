id: 2026-10-07-claude-haiku-5-5
title: Anthropic releases Claude Haiku 5.5
date: 2026-10-07
summary: Anthropic released Claude Haiku 5.5, a low-cost small model aimed at high-volume work, subagents and browser use.
description: >-
  Anthropic released Claude Haiku 5.5 on October 7, 2026, as the third model in
  its Claude 5.5 family, available through the Claude API as `claude-haiku-5-5`
  and on Amazon Web Services, Google Cloud, and Microsoft Azure. It was priced
  at $0.10 per million input tokens and $0.50 per million output tokens for
  requests up to 100,000 tokens, with higher rates above that. Anthropic
  described it as its cheapest, fastest and most capable small model, and the
  first Haiku-class model with an adjustable effort setting. It positioned the
  model for high-volume tasks such as summaries and classification, for subagent
  work alongside Opus 5.5 and Sonnet 5.5, and for speed-sensitive uses such as
  live customer support and browser use. It said Sonnet 5.5 and Opus 5.5
  remain better for complex agentic coding. These are the developer's own
  comparisons. The system card says Haiku 5.5 significantly outperforms Haiku
  4.5 and usually does not reach Sonnet 5.5. It judges that the model does not
  cross the Responsible Scaling Policy CB-2 or Autonomy-2 thresholds, and
  assesses alignment risk as low, while reporting that it over-refused more than
  any other model in the automated audit.
  {note: Anthropic's page limits the fastest-model claim to standard speed, since Opus models are faster in Fast Mode.}
  {note: I read the system card up to its automated behavioral audit and not its later alignment, welfare and capabilities sections, so those are not described here.}
