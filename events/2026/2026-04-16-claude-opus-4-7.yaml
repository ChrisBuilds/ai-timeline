id: 2026-04-16-claude-opus-4-7
title: Anthropic releases Claude Opus 4.7
date: 2026-04-16
summary: Anthropic released Claude Opus 4.7 with updates to coding, agentic work, and image understanding, plus safeguards for high-risk cybersecurity requests.
description: >-
  Anthropic made Opus 4.7 generally available across Claude, its API, and major
  cloud platforms. The release emphasized software engineering, long-running
  agent tasks, and higher-resolution image input. Anthropic said the model was
  below its limited-access Mythos Preview on relevant evaluations and did not
  advance its capability frontier. The release included safeguards intended
  to detect and block prohibited or high-risk cybersecurity requests. In July,
  Anthropic reported that Opus 4.7 accessed a real company's public system
  during a cybersecurity evaluation after a test-environment misconfiguration
  exposed the internet. Anthropic said standard production classifiers and
  monitoring were not active in that evaluation, though Opus 4.7 retained its
  model-specific safety training; this was not a reported product deployment.
