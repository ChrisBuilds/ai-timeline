id: 2026-09-01-claude-fable-5-1-mythos-5-1
title: Anthropic releases Claude Fable 5.1 and restricted Mythos 5.1
date: 2026-09-01
summary: Anthropic released Fable 5.1 for general use and Mythos 5.1, the same model with less restrictive safeguards for vetted cybersecurity and life-sciences work.
description: >-
  Anthropic released Claude Fable 5.1 for general use and Claude Mythos 5.1
  to vetted individuals and organizations through trusted-access programs.
  The two configurations use the same underlying model, but Mythos 5.1 has
  more permissive cybersecurity and life-sciences safeguards. Anthropic
  reported a 52.6% result for Fable 5.1 on Terminal-Bench-Science 0.1, versus
  24.7% for Fable 5 on the same benchmark, and 55.8% versus 42.0% on its
  Terminal-Bench 4.0 evaluation; it said safeguard interventions lowered the
  Fable score on some tasks. It also said the revised safeguards reduced
  cybersecurity false positives by 60% and benign biology interventions by
  85% compared with Fable 5 at launch. A separate Terminal-Bench maintainer
  run scored Fable 5.1 at 57.9% ±3.8% with Claude Code; this used a different
  evaluation setup. Early organizational examples reported by Anthropic
  included an investigation of a rare software crash at Millennium and a
  multi-day prototype built at MongoDB. {note: Anthropic's models index lists
  September 15, but its dated release notes and model documentation, GitHub's
  availability notice, and independent launch coverage identify September 1.}
