id: 2026-05-28-claude-opus-4-8
title: Anthropic releases Claude Opus 4.8
date: 2026-05-28
summary: Anthropic released Claude Opus 4.8 with updates to coding, agentic work, reasoning, and professional tasks.
description: >-
  Anthropic made Opus 4.8 generally available through Claude, its API, and cloud
  platforms at the same standard price as Opus 4.7. The launch also introduced
  effort controls and a research-preview feature in Claude Code that plans work
  across parallel subagents and verifies outputs. Anthropic's system card
  documents pre-release safety and alignment evaluations.
category: model release
tags:
