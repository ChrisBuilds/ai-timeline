importance:
  current: 2026-11-05-v2
  assessments:
    - id: 2026-11-05-v2
      assessed_at: 2026-11-05
      rubric_version: v2
      status: provisional
      reviewer: Codex (editorial assessment prepared for maintainer review)
      rationale: >-
        The release is a measured update to an established hosted model line.
        Independent evaluations show meaningful gains across existing coding,
        agentic, and reasoning tests, while the announcement's dynamic-workflow
        feature is a separate research-preview product capability. The evidence
        supports useful improvement in established approaches (capability 2),
        but does not yet demonstrate the substantial new practical ability in
        the capability-3 anchor. Named
        launch partners describe early testing and task use, supporting
        adoption 1 with low confidence. Attributable downstream influence and
        broad societal effects remain unknown. The provisional v2 score range
        is 16–61; no accepted point score is assigned.
      dimensions:
        influence:
          rating: null
          confidence: low
          rationale: >-
            The release and launch evaluations are documented, but the sources
            do not establish later technical or institutional changes caused
            by Opus 4.8 specifically. Later Anthropic products and model
            releases are not attributed to this version without evidence.
          evidence:
            - https://www.anthropic.com/news/claude-opus-4-8
            - https://artificialanalysis.ai/articles/claude-opus-4-8-analysis-and-benchmarks/
        adoption:
          rating: 1
          confidence: low
          rationale: >-
            Anthropic's launch page quotes named early testers describing
            concrete agent, coding, and professional-work trials. Those
            selected partner examples support isolated experiment or
            deployment, the rating-1 anchor. They do not measure sustained or
            widespread use; broad product and API availability is not treated
            as adoption evidence by itself.
          evidence:
            - https://www.anthropic.com/news/claude-opus-4-8
            - https://github.blog/changelog/2026-05-28-claude-opus-4-8-is-generally-available-for-github-copilot/
        capability:
          rating: 2
          confidence: medium
          rationale: >-
            Artificial Analysis reported a 4.1-point increase over Opus 4.7 on
            its Intelligence Index and gains on several coding, agentic, and
            academic evaluations. Its launch comparisons used max effort and
            the index's selected composite suite; the result supports a useful
            improvement within established model approaches; the reported gains
            do not yet establish a substantial new practical ability beyond
            those approaches. Anthropic's system card provides
            detailed vendor evaluations but does not make the dynamic-workflow
            product preview evidence of a distinct underlying model capability.
            Opus 4.6's capability-3 assessment relied partly on METR's TH1.1
            task-horizon evaluation, a different suite that did not test Opus
            4.8; the ratings therefore do not imply a direct cross-version
            ordering.
          evidence:
            - https://artificialanalysis.ai/articles/claude-opus-4-8-analysis-and-benchmarks/
            - https://www.anthropic.com/news/claude-opus-4-8
            - https://www-cdn.anthropic.com/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf
        society:
          rating: null
          confidence: low
          rationale: >-
            The sources document a commercial release and safety testing, but
            do not measure broad public, professional, or institutional effects
            attributable to Opus 4.8. Organizational reach and future effects
            remain uncertain at this assessment date.
          evidence:
            - https://www.anthropic.com/news/claude-opus-4-8
            - https://www-cdn.anthropic.com/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf
      comparisons:
        - id: 2026-04-16-claude-opus-4-7
          rationale: >-
            Opus 4.7 is the direct predecessor. Artificial Analysis's launch
            evaluation reports a 4.1-point Intelligence Index gain for Opus 4.8
            and improvements across several of its tests. This indicates
            version-level capability progress, while the independent results
            remain bounded to that provider's suite and setup; adoption and
            sustained or widespread use and influence attributable to either
            version remain unmeasured here.
        - id: 2023-03-14-openai-gpt-4
          rationale: >-
            GPT-4 was a cross-organization frontier release that introduced
            image input alongside text and reported broad professional and
            academic benchmark performance. Opus 4.8's evidence centers on
            gains within established coding and agentic workflows, a narrower
            type of contribution; this comparison does not claim equivalent
            adoption or downstream influence.
        - id: 2026-02-05-claude-opus-4-6
          rationale: >-
            Opus 4.6's capability-3 assessment drew partly on METR's TH1.1
            software and research task-horizon results, which did not evaluate
            Opus 4.8. Artificial Analysis's Opus 4.8 results use a different
            composite benchmark suite and effort setup, so they cannot support
            a direct ranking against the METR estimate; the ratings reflect
            different evidence rather than a claim that Opus 4.8 is less
            capable than Opus 4.6.
      questions:
        - What independent longitudinal evidence distinguishes sustained use of Opus 4.8 from other Opus versions?
        - Do independent evaluations show substantial practical abilities that Opus 4.7 could not perform under comparable setups?
        - Which later changes in software or professional practice can be attributed to Opus 4.8 rather than separate product features or later models?
      review_after: 2026-12-05
      review_triggers:
        - Independent version-specific usage evidence that materially changes the adoption assessment.
        - Comparable independent evaluations or attributable successors that materially change the capability assessment.
        - Evidence of durable technical, professional, or institutional effects attributable to Opus 4.8.
