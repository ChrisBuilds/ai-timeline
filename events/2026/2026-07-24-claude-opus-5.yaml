id: 2026-07-24-claude-opus-5
title: Anthropic releases Claude Opus 5
date: 2026-07-24
summary: Anthropic released Claude Opus 5, reporting gains over Opus 4.8 across agentic coding, computer use, and long-horizon work; an independent coding test found a higher pass rate on a shared Java task set.
description: >-
  Anthropic released Claude Opus 5 as the successor to Opus 4.8. Its launch
  announcement and system card report gains across agentic coding, computer
  use, long-horizon knowledge work, mathematics, and science. The announcement
  describes early-access partners using the model for concrete work, including
  one account of production adoption; these examples were selected and reported
  by Anthropic. In a later test, SonarSource reported an 88.6% pass rate for
  Opus 5 versus 82.9% for Opus 4.8 on the same 544 Java HumanEval and MBPP tasks.
  That independent result covers a limited coding task set and does not measure
  use or capability across other fields.
category: model release
