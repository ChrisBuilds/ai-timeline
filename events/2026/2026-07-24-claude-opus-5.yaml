importance:
  current: 2026-11-06-v2
  assessments:
    - id: 2026-11-06-v2
      assessed_at: 2026-11-06
      rubric_version: v2
      status: provisional
      reviewer: Claude (editorial assessment prepared for maintainer review)
      rationale: >-
        Anthropic's announcement and system card report broad gains over Opus
        4.8 and make Opus 5 the default model on the Max plan at an unchanged
        API price. These are developer-reported results and availability, not
        independent evidence of sustained use or downstream change. No
        third-party evaluation or usage source could be fetched. With influence
        and society unknown, adoption 1 and capability 2, the provisional score
        range is 16–61; the index placement key uses the lower bound, with no
        accepted point score.
      dimensions:
        influence:
          rating: null
          confidence: low
          rationale: >-
            The sources describe the release but do not identify later technical
            or institutional changes attributable to Opus 5 itself, as distinct
            from other Claude releases.
          evidence:
            - https://www.anthropic.com/news/claude-opus-5
        adoption:
          rating: 1
          confidence: low
          rationale: >-
            Opus 5 was offered across Claude plans and the API. This is
            availability, which is not counted as adoption. No source measures
            sustained or widespread use, so the rating reflects only the
            isolated-deployment anchor.
          evidence:
            - https://www.anthropic.com/news/claude-opus-5
        capability:
          rating: 2
          confidence: low
          rationale: >-
            The system card reports broad gains over Opus 4.8, but also says the
            model trails Mythos 5 on cyber capabilities and does not advance the
            frontier in risky dual-use capabilities, so the evidence is of a
            useful improvement within an established approach. The results are
            vendor-produced and no independent evaluation was found.
          evidence:
            - https://www.anthropic.com/claude-opus-5-system-card
            - https://www.anthropic.com/news/claude-opus-5
        society:
          rating: null
          confidence: low
          rationale: >-
            The sources do not measure public, professional, or institutional
            effects attributable to Opus 5.
          evidence:
            - https://www.anthropic.com/news/claude-opus-5
      comparisons:
        - id: 2026-04-16-claude-opus-4-7
          rationale: >-
            Opus 4.7 is an earlier release in the same line. Both are
            vendor-reported incremental gains within the Opus family, and
            available evidence supports a similar placement.
        - id: 2026-02-05-claude-opus-4-6
          rationale: >-
            Opus 4.6 was assessed on a broader set of reported improvements
            including third-party task-horizon evidence. Opus 5 has no
            comparable independent evidence yet, so it is rated lower on
            capability.
        - id: 2025-01-20-deepseek-r1
          rationale: >-
            DeepSeek R1 shipped open weights and a technical report that others
            could inspect and reuse. Opus 5 is a closed hosted model, and the
            evidence does not establish a comparable research or open-ecosystem
            contribution.
      questions:
        - What independent, version-specific evidence measures sustained use of Opus 5 across products and APIs?
        - Do independent evaluations reproduce the reported gains over Opus 4.8?
        - Which downstream workflows can be attributed to Opus 5 rather than to the Claude 5 family generally?
      review_after: 2026-12-06
      review_triggers:
        - Independent usage evidence that distinguishes Opus 5 and changes the adoption assessment.
        - Independent evaluations that materially change the capability assessment.
