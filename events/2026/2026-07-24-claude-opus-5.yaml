id: 2026-07-24-claude-opus-5
title: Anthropic releases Claude Opus 5
date: 2026-07-24
summary: Anthropic released Claude Opus 5, a new Opus generation for coding, professional work, and long-running agents, at the same API price as Opus 4.8.
description: >-
  Anthropic released Claude Opus 5, which it called a thoughtful and proactive
  model, as the successor to Opus 4.8. It became the default model on the Max
  plan and was available through the Claude API as `claude-opus-5`, at $5 per
  million input tokens and $25 per million output tokens, the same as Opus 4.8.
  A Fast mode that Anthropic said runs about 2.5 times faster was offered at
  twice the base price on the Claude Platform. Anthropic said Opus 5 comes close
  to the intelligence of its Fable 5 model at half the price and is
  state-of-the-art on Frontier-Bench and GDPval-AA, while remaining behind
  Mythos 5 on cybersecurity. It reported results from its own runs, including
  more than double Opus 4.8's performance on Frontier-Bench v0.1. These are the
  developer's own comparisons. Its system card reports broad gains over Opus 4.8,
  largest in agentic coding, computer use, and long-horizon knowledge work, and
  also reports that the model hallucinates factual claims slightly more than
  Opus 4.8. The card treats the model as ASL-3, concludes that it does not
  cross Anthropic's automated AI R&D threshold, and says its cyber capabilities
  exceed Opus 4.8 but fall short of Mythos 5. Anthropic said it deliberately did
  not train the model on cyber tasks, and that flagged requests fall back to
  Opus 4.8 by default.
  {note: Anthropic's announcement page was modified after July 24 without saying what changed; this entry describes the launch and its system card, whose later sections I could not read in full.}
