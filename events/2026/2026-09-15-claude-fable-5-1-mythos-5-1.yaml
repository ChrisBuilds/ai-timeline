id: 2026-09-15-claude-fable-5-1-mythos-5-1
title: Anthropic releases Claude Fable 5.1 and restricted Mythos 5.1
date: 2026-09-15
summary: Anthropic released Fable 5.1 for general use and Mythos 5.1, the same model with more permissive safeguards, to vetted organizations in two trusted-access programs.
description: >-
  Anthropic introduced Claude Fable 5.1 and Claude Mythos 5.1 on September 15,
  2026, describing them as the same model with different levels of safeguards.
  Fable 5.1 (`claude-fable-5-1`) was made available on the Claude API and on
  Amazon Web Services, Google Cloud, and Microsoft Azure, at $10 per million
  input tokens and $50 per million output tokens, the same prices as Fable 5.
  Mythos 5.1 has more permissive safeguards for cybersecurity and life
  sciences work and was available only through two verification programs, the
  Cyber Verification Program and the Life Sciences Verification Program, to a
  set of US organizations. Anthropic said it was working with the US
  government to widen access. Anthropic said its newest cyber safeguards
  produce 60% fewer false positives and let Fable 5.1 be used to find software
  vulnerabilities but not to develop exploits, and that its biology safeguards
  fire 85% less often on benign elementary biology and medical questions than
  at Fable 5's launch. It reported Terminal-Bench 4.0 scores of 55.8% for
  Fable 5.1 and 60.9% for Mythos 5.1, against 42.0% for Fable 5; these are
  the developer's own results.
  {note: The announcement page gives only "September 2026"; the day comes from Anthropic's models index, which lists the entry as dated Sep 15, 2026.}
  {note: Anthropic said safeguards intervened on some benchmark tasks and likely lowered Fable 5.1's reported scores.}
