id: 2026-04-07-claude-mythos-preview
title: Anthropic opens restricted access to Claude Mythos Preview
date: 2026-04-07
summary: Anthropic opened Claude Mythos Preview to selected organizations through Project Glasswing for defensive security work.
description: >-
  Anthropic announced Project Glasswing and opened Claude Mythos Preview to
  twelve named launch partners, with access extended to more than 40 additional
  organizations that build or maintain critical software. It described the
  general-purpose model as available for defensive security work and said it
  did not plan to make it generally available.

  The UK AI Security Institute later independently evaluated this preview. In
  its controlled cyber range, a 32-step simulated corporate network attack,
  Mythos Preview completed an average of 22 steps and finished the whole range
  in three of ten attempts; Claude Opus 4.6 averaged 16 steps under the same
  evaluation. AISI said the range used vulnerable systems without active
  defenders or defensive tools, so the result does not establish performance
  against well-defended real networks. Its evaluation also found improved
  performance on capture-the-flag tasks, including a 73% success rate on its
  expert-level set.
