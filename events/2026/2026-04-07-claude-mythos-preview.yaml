id: 2026-04-07-claude-mythos-preview
title: Anthropic opens restricted access to Claude Mythos Preview
date: 2026-04-07
summary: Anthropic made Claude Mythos Preview available as a gated research preview through Project Glasswing, limited to partner organizations for defensive security work.
description: >-
  Anthropic announced Project Glasswing, an initiative that gave selected
  organizations early access to Claude Mythos Preview, which it described as
  its most capable model for coding and agentic tasks, to find and fix
  vulnerabilities in critical software. Twelve launch partners were named,
  including Amazon Web Services, Apple, Cisco, CrowdStrike, Google,
  JPMorganChase, the Linux Foundation, Microsoft, NVIDIA and Palo Alto
  Networks, with access extended to more than 40 other organizations that
  maintain critical software. Anthropic committed up to $100 million in usage
  credits and $4 million in donations to open-source security organizations,
  and priced participant use at $25 per million input tokens and $125 per
  million output tokens. Anthropic said it did not plan to make the model
  generally available, mainly because of its cyber capabilities. Its system card
  describes a step-change in finding and exploiting zero-day vulnerabilities,
  says the decision did not stem from Responsible Scaling Policy requirements,
  and concludes that the model does not cross its automated AI R&D threshold.
  Anthropic reported that the model had found thousands of high- and
  critical-severity vulnerabilities, but said over 99% were still unpatched at
  the time, so most claims could not be independently verified. These
  capability figures are the developer's own.
