importance:
  current: 2026-11-06-v2
  assessments:
    - id: 2026-11-06-v2
      assessed_at: 2026-11-06
      rubric_version: v2
      status: provisional
      reviewer: Claude (editorial assessment prepared for maintainer review)
      rationale: >-
        Anthropic's announcement and system card report gains over Opus 5 at a
        20% lower API price, with availability on three major cloud platforms.
        These are developer-reported results and availability, not independent
        evidence of sustained use or downstream change. No third-party
        evaluation or usage source was checked. With influence and society
        unknown, adoption 1 and capability 2, the provisional score range is
        16-61, with no accepted point score.
      dimensions:
        influence:
          rating: null
          confidence: low
          rationale: >-
            The sources describe the release but do not identify later technical
            or institutional changes attributable to Opus 5.5 itself, as
            distinct from other Claude releases.
          evidence:
            - https://www.anthropic.com/claude-opus-5-5
        adoption:
          rating: 1
          confidence: low
          rationale: >-
            Availability on the API and three cloud platforms is not counted as
            adoption. The announcement cites one customer's testing, which is
            an isolated deployment, and no source measures sustained use.
          evidence:
            - https://www.anthropic.com/claude-opus-5-5
        capability:
          rating: 2
          confidence: low
          rationale: >-
            The system card reports higher scores than Opus 5 on every
            evaluation in its capability summary, a useful improvement within
            an established approach. The results are vendor-produced and no
            independent evaluation was found.
          evidence:
            - https://anthropic.com/claude-opus-5-5-system-card
            - https://www.anthropic.com/claude-opus-5-5
        society:
          rating: null
          confidence: low
          rationale: >-
            The sources do not measure public, professional, or institutional
            effects attributable to Opus 5.5.
          evidence:
            - https://www.anthropic.com/claude-opus-5-5
      comparisons:
        - id: 2026-04-16-claude-opus-4-7
          rationale: >-
            Opus 4.7 is an earlier release in the same line. Both are
            vendor-reported incremental gains within the Opus family, and
            available evidence supports a similar placement.
        - id: 2026-02-05-claude-opus-4-6
          rationale: >-
            Opus 4.6 was assessed with third-party task-horizon evidence. Opus
            5.5 has no comparable independent evidence yet, so it is rated lower
            on capability.
        - id: 2025-01-20-deepseek-r1
          rationale: >-
            DeepSeek R1 shipped open weights and a technical report that others
            could inspect and reuse. Opus 5.5 is a closed hosted model, and the
            evidence does not establish a comparable research contribution.
      questions:
        - What independent, version-specific evidence measures sustained use of Opus 5.5?
        - Do independent evaluations reproduce the reported gains over Opus 5?
        - Do the lower price and speed change how teams choose between model tiers?
      review_after: 2026-12-06
      review_triggers:
        - Independent usage evidence that distinguishes Opus 5.5 and changes the adoption assessment.
        - Independent evaluations that materially change the capability assessment.
