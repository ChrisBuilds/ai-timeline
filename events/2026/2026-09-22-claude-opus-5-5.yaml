id: 2026-09-22-claude-opus-5-5
title: Anthropic releases Claude Opus 5.5
date: 2026-09-22
summary: Anthropic released Claude Opus 5.5, reporting improved coding and knowledge-work performance and lower typical workload costs than Opus 5.
description: >-
  Anthropic introduced Claude Opus 5.5 as the first model in its Claude 5.5
  family on September 22, 2026. It was available through the Claude API and
  cloud platforms, at $4 per million input tokens and $20 per million output
  tokens. Anthropic reported stronger performance than Opus 5 on its selected
  coding, computer-use, and knowledge-work evaluations and a 40% lower cost on
  typical workloads. It reported that an early tester completed a 680,000-line
  code migration in less than a day, and described customer evaluations,
  including Box's test of token use. These are attributed company claims and
  selected examples, not independent evidence of broad or sustained adoption. The release's
  published benchmark results use different effort settings and, when
  safeguards intervene, some benchmark tasks are completed by fallback models;
  they should not be read as a single like-for-like measure of the model alone.
