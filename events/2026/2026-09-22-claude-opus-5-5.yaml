id: 2026-09-22-claude-opus-5-5
title: Anthropic releases Claude Opus 5.5
date: 2026-09-22
summary: Anthropic released Claude Opus 5.5, a new Opus model priced 20% below Opus 5, for coding, computer use, and professional work.
description: >-
  Anthropic released Claude Opus 5.5 on September 22, 2026, available through
  the Claude API as `claude-opus-5-5` and on Amazon Web Services, Google Cloud,
  and Microsoft Azure. It was priced at $4 per million input tokens and $20 per
  million output tokens, 20% less than Opus 5, with a Fast mode at $8 and $40.
  Anthropic said the model performs at the level of its Claude Fable 5.1 on
  most work and costs about 40% less to run than Opus 5 on typical workloads,
  with output more than 30% faster, and that it leads on agentic coding,
  computer use, and knowledge work. These are the developer's own comparisons.
  Thinking can no longer be switched off, and Anthropic said cybersecurity
  tasks are mostly re-routed to Opus 4.8. The system card says Opus 5.5 scored
  higher than Opus 5 on every evaluation in its capability summary, meets or
  exceeds Mythos 5.1 and Opus 5 on its internal cyber evaluations, and does not
  cross the threshold for dramatic acceleration of automated AI R&D. It also
  reports a slightly lower harmless-response rate than Opus 5 and greater
  susceptibility to malicious instructions pasted into a user's own prompt.
  {note: I read about the first fifth of the system card, so later alignment and evaluation-awareness findings are not described here.}
