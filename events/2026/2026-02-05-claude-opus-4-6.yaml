id: 2026-02-05-claude-opus-4-6
title: Anthropic releases Claude Opus 4.6
date: 2026-02-05
summary: Anthropic released Claude Opus 4.6 with updated coding and agent capabilities and a 1M-token context window in beta.
description: >-
  Anthropic made Opus 4.6 available through Claude, its API, and major cloud
  platforms. The release added a 1M-token context window in beta on the Claude
  Developer Platform. Anthropic reported gains on coding, agentic, and knowledge
  work evaluations. METR later estimated a 12-hour 50% task horizon on its
  software and research task suite, but found that the result was sensitive to
  task selection and modeling assumptions; it fell to 7 hours 11 minutes when
  public tasks were excluded. These task-specific estimates do not establish
  general workplace productivity. Anthropic's later Economic Index reports
  usage by model class, not Opus 4.6 specifically, so they do not establish
  version-specific adoption.
category: model release
tags:
  - language model
  - coding
  - reasoning
  - agents
  - computer use
organizations:
  - Anthropic
