id: 2026-06-30-claude-sonnet-5
title: Anthropic releases Claude Sonnet 5
date: 2026-06-30
summary: Anthropic released Claude Sonnet 5, an upgrade to Sonnet 4.6 for coding, tool use, and agentic work, as the default model for Free and Pro users.
description: >-
  Anthropic released Sonnet 5, which it called its most agentic Sonnet yet, as
  an upgrade to Sonnet 4.6. It became the default model for Claude's Free and
  Pro plans and was available on Max, Team, and Enterprise plans and through the
  Claude API as `claude-sonnet-5`. Anthropic priced it at $2 per million input
  tokens and $10 per million output tokens, introductory pricing that it made
  permanent in August. Anthropic said its performance was close to that of Opus
  4.8 at lower prices and that it improved on Sonnet 4.6 in reasoning, tool use,
  coding, and knowledge work. These are the developer's own comparisons. Its
  system card reports clear gains over Sonnet 4.6 in coding, agentic search,
  multimodal reasoning, and professional tasks, while trailing Anthropic's Opus
  and Mythos models in almost all cases. The card concludes that Sonnet 5 does
  not cross Anthropic's automated AI R&D capability threshold and reports that
  it never developed a full working exploit in cyber evaluations. GitHub made
  the model available in Copilot the same day, with a gradual rollout.
  {note: Anthropic later revised some launch charts, and the page was updated after June 30; this entry describes the launch as first published.}
