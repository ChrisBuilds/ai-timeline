importance:
  current: 2026-11-06-v2
  assessments:
    - id: 2026-11-06-v2
      assessed_at: 2026-11-06
      rubric_version: v2
      status: provisional
      reviewer: Claude (editorial assessment prepared for maintainer review)
      rationale: >-
        Anthropic's system card reports clear gains over Sonnet 4.6 in coding,
        agentic search, multimodal reasoning, and professional tasks, and the
        launch makes the model the default for Free and Pro plans. These are
        developer-reported results and availability, not independent evidence
        of sustained use or downstream change. The only third-party signal
        found is GitHub's same-day Copilot availability notice, which shows
        distribution rather than measured use. With influence and society
        unknown, adoption 1 and capability 2, the provisional score range is
        16–61; the index placement key uses the lower bound, with no accepted
        point score.
      dimensions:
        influence:
          rating: null
          confidence: low
          rationale: >-
            The sources describe the release but do not identify later
            technical or institutional changes attributable to Sonnet 5
            itself, as distinct from other Claude releases.
          evidence:
            - https://www.anthropic.com/news/claude-sonnet-5
            - https://www.anthropic.com/claude-sonnet-5-system-card
        adoption:
          rating: 1
          confidence: low
          rationale: >-
            Sonnet 5 became the default model on Free and Pro plans and was
            offered in GitHub Copilot across several editors and surfaces. This
            is availability, which is not counted as adoption. No source
            measures sustained or widespread use, so the rating reflects only
            the isolated-deployment anchor.
          evidence:
            - https://www.anthropic.com/news/claude-sonnet-5
            - https://github.blog/changelog/2026-06-30-claude-sonnet-5-is-generally-available-for-github-copilot/
        capability:
          rating: 2
          confidence: low
          rationale: >-
            Anthropic's system card reports clear gains over Sonnet 4.6, but
            also says the model trails the Opus and Mythos models in almost all
            cases, so the evidence is of a useful improvement within an
            established approach. The results are vendor-produced and no
            independent evaluation was found.
          evidence:
            - https://www.anthropic.com/claude-sonnet-5-system-card
            - https://www.anthropic.com/news/claude-sonnet-5
        society:
          rating: null
          confidence: low
          rationale: >-
            The sources do not measure public, professional, or institutional
            effects attributable to Sonnet 5.
          evidence:
            - https://www.anthropic.com/news/claude-sonnet-5
      comparisons:
        - id: 2026-02-17-claude-sonnet-4-6
          rationale: >-
            Sonnet 4.6 is the direct predecessor. Both are vendor-reported
            capability gains with sparse independent evidence on sustained use;
            Sonnet 4.6 was rated capability 3 on a broader set of reported
            improvements, while this record rates 2 because Sonnet 5's gains
            over Sonnet 4.6 are documented mainly in developer-run evaluations.
        - id: 2026-04-16-claude-opus-4-7
          rationale: >-
            Opus 4.7 was a higher-tier hosted model with independent benchmark
            evidence. Sonnet 5 is a lower-priced model in the same family, and
            available evidence supports a similar incremental placement.
        - id: 2025-01-20-deepseek-r1
          rationale: >-
            DeepSeek R1 shipped open weights and a technical report that others
            could inspect and reuse. Sonnet 5 is a closed hosted model, and the
            evidence does not establish a comparable research or open-ecosystem
            contribution.
      questions:
        - What independent, version-specific evidence measures sustained use of Sonnet 5 across products and APIs?
        - Do independent evaluations reproduce the reported gains over Sonnet 4.6 and the claimed closeness to Opus 4.8?
        - Which downstream workflows can be attributed to Sonnet 5 rather than to the Claude 5 family generally?
      review_after: 2026-12-06
      review_triggers:
        - Independent usage evidence that distinguishes Sonnet 5 and changes the adoption assessment.
        - Independent evaluations that materially change the capability assessment.
