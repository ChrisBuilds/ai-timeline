id: 2026-06-30-claude-sonnet-5
title: Anthropic releases Claude Sonnet 5
date: 2026-06-30
summary: Anthropic released Claude Sonnet 5, an upgrade to Sonnet 4.6 for coding, tool use, and agentic work, as the default model for Free and Pro users.
description: >-
  Anthropic released Sonnet 5, which it called its most agentic Sonnet yet, as
  an upgrade to Sonnet 4.6. It became the default model for Claude's Free and
  Pro plans and was available on Max, Team, and Enterprise plans and through the
  Claude API as `claude-sonnet-5`. At launch Anthropic priced it at $2 per
  million input tokens and $10 per million output tokens, which it made
  permanent in August. Anthropic described improvements over Sonnet 4.6 in
  reasoning, tool use, coding, and knowledge work; its system card reports gains
  across coding, agentic search, multimodal reasoning, and professional tasks.
  The company also cited early-access partners describing multi-step software
  work and agents handling insurance and data-analysis workflows. These are
  developer-produced evaluations and selected partner reports. The system card
  says Sonnet 5 trailed Anthropic's Opus and Mythos models in most evaluations
  and did not cross its automated AI R&D capability threshold. GitHub announced
  a gradual Copilot rollout the same day.
  {note: Anthropic's launch page records a June 30 correction to its BrowseComp chart methodology and an August pricing update; the event description distinguishes the launch price from its later permanence.}
