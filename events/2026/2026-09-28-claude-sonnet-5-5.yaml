id: 2026-09-28-claude-sonnet-5-5
title: Anthropic releases Claude Sonnet 5.5
date: 2026-09-28
summary: Anthropic released Claude Sonnet 5.5, reporting faster performance and lower task costs than Sonnet 5 for coding and knowledge work.
description: >-
  Anthropic released Claude Sonnet 5.5 on September 28, 2026, as the second
  model in its Claude 5.5 family. It positioned the model as a faster,
  lower-cost complement to Opus 5.5, priced at $2 per million input tokens and
  $10 per million output tokens. Anthropic said Sonnet 5.5 runs more than 30%
  faster and costs up to 30% less on most work than Sonnet 5. Its announcement
  reported a 70.6% score on Terminal-Bench 4.0, compared with 10.3% for Sonnet
  5, and described customer evaluations of coding and knowledge-work tasks.
  These performance results and examples are attributed to Anthropic. Vals AI
  separately evaluated Sonnet 5.5 across its benchmark suite; its Terminal-Bench
  4.0 result included fallback assistance from Sonnet 5 on refusals.
