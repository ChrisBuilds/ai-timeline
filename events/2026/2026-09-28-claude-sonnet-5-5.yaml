id: 2026-09-28-claude-sonnet-5-5
title: Anthropic releases Claude Sonnet 5.5
date: 2026-09-28
summary: Anthropic released Claude Sonnet 5.5, a faster, lower-cost Claude model priced at $2 and $10 per million tokens.
description: >-
  Anthropic released Claude Sonnet 5.5 on September 28, 2026, as the second
  model in its Claude 5.5 family, available through the Claude API as
  `claude-sonnet-5-5` and on Amazon Web Services, Google Cloud, and Microsoft
  Azure. It was priced at $2 per million input tokens and $10 per million
  output tokens, half the price of Opus 5.5. Anthropic described it as a faster,
  lower-cost complement to Opus 5.5, with output more than 30% faster than
  Sonnet 5 and up to 30% lower cost per task in its own testing. It said Opus
  5.5 remains stronger at complex, open-ended work. These are the developer's
  own comparisons. Higher-risk cybersecurity requests fall back to Sonnet 5,
  which Anthropic said makes it the first Sonnet model launched with such
  fallbacks. The system card says Sonnet 5.5 significantly outperforms Sonnet 5,
  is usually below Opus 5.5, does not cross the Responsible Scaling Policy
  threshold for automated AI R&D, and is assessed as low risk for
  misalignment. It also says the model is less robust than Opus 5 or Fable 5.1
  under adversarial red-teaming.
  {note: I read the first 100,000 of about 113,000 characters of the system card, so its later capabilities and model welfare sections are not described here.}
