id: 2026-02-17-claude-sonnet-4-6
title: Anthropic releases Claude Sonnet 4.6
date: 2026-02-17
summary: Anthropic released Claude Sonnet 4.6 with updates to coding, computer use, long-context reasoning, and agent planning.
description: >-
  Anthropic released Sonnet 4.6 as an upgrade across coding, computer use,
  long-context reasoning, and agent planning, with a 1-million-token context
  window in beta. Anthropic made it the default model for Free and Pro users
  in Claude.ai and Claude Cowork. Its system card reports improvements over
  Sonnet 4.5 across a wide range of evaluations, with some results approaching
  or matching Opus 4.6. Anthropic also reported that users in early Claude Code
  testing preferred Sonnet 4.6 to Sonnet 4.5 about 70% of the time. The launch
  page includes customer reports of testing and using the model in coding,
  document, and business workflows; these selected testimonials do not measure
  broad or sustained use.
