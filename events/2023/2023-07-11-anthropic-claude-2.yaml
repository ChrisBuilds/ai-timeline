id: 2023-07-11-anthropic-claude-2
title: Anthropic releases Claude 2
date: 2023-07-11
summary: Anthropic released Claude 2 through its API and a public beta in the US and UK, with inputs of up to 100,000 tokens.
description: |
  Anthropic announced Claude 2 as a new model with improved performance and longer responses. Businesses could access it through the API, while people in the US and UK could use a public beta chat experience. Prompts could contain up to 100,000 tokens. Anthropic also reported improvements in coding, math, and reasoning; its performance comparisons were based on the company's own evaluations.
