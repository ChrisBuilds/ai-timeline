id: 2023-02-24-meta-llama-research-release
title: Meta announces LLaMA and grants researchers access
date: "2023-02-24"
summary: >-
  Meta announced LLaMA, a family of language models from 7B to 65B parameters, and offered access to
  researchers through an application under a noncommercial license.
description: >-
  Meta introduced LLaMA as a family of foundation language models trained across 7B, 13B, 33B, and
  65B parameter sizes. The announcement offered model weights to academic researchers, government
  and civil society organizations, and industry research laboratories through an application
  process, under a noncommercial research license. This records the restricted initial release; it
  does not describe LLaMA as an unrestricted open-source release or conflate it with the later
  public leak or LLaMA 2.
