id: 2023-11-21-claude-2-1
title: Anthropic releases Claude 2.1
date: "2023-11-21"
summary: >-
  Anthropic released Claude 2.1 with a 200,000-token context window and beta tool use for
  orchestrating developer-defined functions and APIs.
description: >-
  Claude 2.1 became available through Anthropic's API and powered Claude's chat experience. The
  200,000-token context window was available to Claude Pro users; API tool use launched in beta.
