id: 2023-08-22-meta-seamlessm4t
title: Meta releases SeamlessM4T for multilingual speech and text translation
date: "2023-08-22"
summary: >-
  Meta released SeamlessM4T, a single model for multilingual speech recognition and translation among
  speech and text.
description: >-
  SeamlessM4T supports speech recognition and several speech and text translation tasks across many
  languages, with language coverage varying by task. Meta released the model for research use and
  published the SeamlessAlign dataset metadata. The model's performance comparisons are reported by
  its authors.
category: model release
