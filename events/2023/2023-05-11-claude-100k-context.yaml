title: Anthropic expands Claude's context window to 100,000 tokens
date: "2023-05-11"
summary: >-
  Anthropic expanded Claude's context window from 9,000 to 100,000 tokens and
  made the larger window available through its API.
description: >-
  Anthropic announced that Claude's context window had grown from 9,000 to
  100,000 tokens, with the larger window available through its API. The company
  said this let users submit hundreds of pages of material for analysis in one
  request.
