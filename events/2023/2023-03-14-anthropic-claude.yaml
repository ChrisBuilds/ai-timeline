id: 2023-03-14-anthropic-claude
title: Anthropic introduces Claude and Claude Instant
date: "2023-03-14"
summary: >-
  Anthropic introduced Claude and Claude Instant, offering the models through partner integrations
  and an API access program.
description: >-
  Anthropic described Claude as a conversational assistant available through partner products and
  its developer console. Claude Instant was presented as a faster, lighter, lower-cost version.
  Access was offered by request.
