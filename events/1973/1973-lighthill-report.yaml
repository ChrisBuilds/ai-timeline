id: 1973-lighthill-report
title: The Lighthill report criticises AI research in Britain
date: "1973"
summary: >-
  Sir James Lighthill's survey for the UK Science Research Council, "Artificial Intelligence: A
  General Survey", concluded that AI had failed to meet its promises outside narrow domains, and it
  is often credited with cutting UK funding.
description: |
  The Science Research Council asked Lighthill, a Cambridge applied mathematician from
  outside the field, to appraise AI research. The SRC chair wrote to him in September
  1971, and he submitted the report in March 1972. The Council published it in 1973 in
  *Artificial Intelligence: a Paper Symposium*, alongside replies from Stuart Sutherland,
  Roger Needham, Christopher Longuet-Higgins and Donald Michie.

  Lighthill divided the work into advanced automation (A), computer-based study of the
  central nervous system (C), and a "bridge" category of building robots (B). He judged
  B the most disappointing, doubted that AI was a coherent field, and blamed much of the
  disappointment on "failure to recognise the implications of the combinatorial explosion".
  A BBC debate on the report followed in June 1973.

  Historians and the Chilton Computing archive describe a loss of confidence in AI among
  UK funders that lasted almost a decade, until a 1982 review led to the Alvey programme.
  Jon Agar writes that the SRC funded categories A and C separately and left B without
  support. The report is often named as a cause of the first "AI winter", but Agar finds no
  figures for the cuts and notes that the criticisms resonated beyond the UK. The month of
  publication is not confirmed.
