id: 2024-03-13-anthropic-claude-3-haiku
title: Anthropic releases Claude 3 Haiku
date: 2024-03-13
summary: Anthropic released Claude 3 Haiku, a fast, lower-cost vision-capable model, through its API, Claude.ai for Pro subscribers, and Amazon Bedrock.
description: |
  Claude 3 Haiku became available alongside Sonnet and Opus in the Claude API and on Claude.ai for Pro subscribers. It was also available on Amazon Bedrock; Anthropic said Google Cloud Vertex AI support was coming soon. Anthropic described Haiku as the fastest and most affordable model in its intelligence class and reported strong vision capabilities. Speed, pricing, and benchmark comparisons are the company's claims.
