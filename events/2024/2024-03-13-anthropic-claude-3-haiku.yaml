      comparisons:
        - id: 2024-03-04-claude-3-opus-sonnet
          rationale: >-
            The accepted assessment for the March 4 family launch is 78. It covers the release of Opus and
            Sonnet and the family-wide vision capability; Haiku's March 13 milestone adds a lower-cost,
            faster tier, with no evidence here of separate adoption or influence.
        - id: 2023-03-14-openai-gpt-4
          rationale: >-
            The accepted assessment for GPT-4 is 80 and includes documented multimodal capability and
            broader release access. Haiku's lower-bound score is lower on the evidence currently established;
            its upper bound remains open because adoption and influence are unknown.
        - id: 2022-11-30-chatgpt-launch
          rationale: >-
            The accepted assessment for the ChatGPT launch is 90, supported by later evidence of broad
            everyday adoption. Haiku's release announcement establishes access, not comparable downstream
            use or cultural reach.
      questions:
        - Is there independent longitudinal evidence of sustained Haiku use across its intended developer and enterprise audiences?
        - Which later products or workflows can be attributed specifically to Haiku rather than the Claude 3 family?
        - Do independent comparisons confirm a distinct capability or cost advantage for Haiku?
      review_after: 2026-12-05
      review_triggers:
