      reviewer: Codex (editorial assessment prepared for maintainer review)
      rationale: >-
        This assessment separates the March 13 Haiku availability milestone from the March 4 Claude 3
        family announcement. The sources establish access and vendor-described speed, cost, and vision
        capability, but do not establish later adoption or downstream effects attributable to Haiku.
        The range is therefore provisional and does not claim an accepted point score.
      dimensions:
