            The announcements establish the model's intended role and release channels, but provide no
            longitudinal evidence of downstream influence attributable to Haiku.
          evidence:
            - https://www.anthropic.com/news/claude-3-haiku
            - https://www.anthropic.com/news/claude-3-family
        adoption:
          rating: null
          confidence: low
          rationale: >-
            API, Claude Pro, and Bedrock availability are access signals, not evidence of actual or sustained
            adoption; no independent usage evidence specific to Haiku is established here.
          evidence:
            - https://www.anthropic.com/news/claude-3-haiku
        capability:
          rating: 2
          confidence: medium
          rationale: >-
            Haiku added a faster, lower-cost option with vision within the Claude 3 family, a useful
            efficiency improvement. Vision and 200K context were family-level features, while the speed
