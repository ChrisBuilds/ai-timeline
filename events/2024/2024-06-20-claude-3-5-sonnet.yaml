id: 2024-06-20-claude-3-5-sonnet
title: Anthropic launches Claude 3.5 Sonnet
date: "2024-06-20"
summary: >-
  Anthropic released Claude 3.5 Sonnet, a vision-capable model, and introduced
  the Artifacts workspace in preview on Claude.ai.
description: >-
  Claude 3.5 Sonnet was the first release in Anthropic's Claude 3.5 model family.
  It became available on Claude.ai and its iOS app, as well as through the
  Anthropic API, Amazon Bedrock and Google Cloud Vertex AI. Anthropic also
  introduced Artifacts in preview, showing generated code, documents and
  designs in a separate workspace alongside the conversation.
category: model release
organizations: [Anthropic]
tags: [large language model, vision, coding, multimodal]
