id: 2024-10-08-nobel-physics-neural-networks
title: Nobel Prize in Physics recognizes neural-network foundations
date: "2024-10-08"
summary: >-
  The 2024 Physics Nobel was awarded to John Hopfield and Geoffrey Hinton for
  foundational discoveries and inventions that enable machine learning with
  artificial neural networks.
description: >-
  The Royal Swedish Academy of Sciences awarded the 2024 Nobel Prize in Physics
  to John J. Hopfield and Geoffrey E. Hinton for foundational discoveries and
  inventions enabling machine learning with artificial neural networks.
  Hopfield was recognized for associative memory, and Hinton for methods that
  can autonomously discover properties in data. This records the Physics
  announcement on 8 October; the separate Chemistry Nobel announcement followed
  on 9 October and recognized different work.
