id: 2009-06-imagenet-cvpr
title: Deng and colleagues introduce the ImageNet database
date: "2009-06"
summary: >-
  Jia Deng and colleagues introduce ImageNet, a WordNet-organized image database
  that contained 3.2 million images across 5,247 synsets in their CVPR 2009 paper.
description: |
  The paper presents ImageNet as a large-scale resource for visual recognition,
  organized using WordNet's hierarchy. It describes 3.2 million images across
  5,247 synsets and proposes the database as training and benchmarking material.
  The paper appeared in the CVPR 2009 proceedings; the conference ran June 20–25,
  but the exact day of this presentation is not confirmed.
