id: 2018-06-11-openai-gpt-1
title: OpenAI releases the original GPT research and model
date: "2018-06-11"
summary: OpenAI published a Transformer language model pretrained on unlabeled text and then fine-tuned on supervised tasks, later known as GPT-1.
description: >-
  OpenAI announced a two-stage approach that first trains a Transformer on
  unlabeled text with a language-modeling objective and then fine-tunes it on
  smaller supervised datasets. The accompanying paper by Alec Radford, Karthik
  Narasimhan, Tim Salimans and Ilya Sutskever, "Improving Language Understanding
  by Generative Pre-Training", describes a 12-layer decoder-only Transformer
  trained on BooksCorpus. The authors reported that this single task-agnostic
  model outperformed models with architectures crafted for each task, improving
  on the previous best results on 9 of the 12 tasks they studied. These results
  are the authors' own. OpenAI also published code and a model for reproducing
  one of the results. The name "GPT" was applied later; the paper calls the
  model a "Finetuned Transformer LM"{note: the name GPT-1 is a later label, and
  the announcement page and paper do not use it}.
category: model release
