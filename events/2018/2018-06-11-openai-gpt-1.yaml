id: 2018-06-11-openai-gpt-1
title: OpenAI releases the original GPT research and model
date: "2018-06-11"
summary: OpenAI published a Transformer language model pretrained on unlabeled text and fine-tuned for supervised tasks, a research approach later developed in GPT-2 and other language models.
description: >-
  OpenAI reported a two-stage method: first pretrain a Transformer language model
  on unlabeled text, then fine-tune it for supervised tasks. The paper describes a
  12-layer decoder-only Transformer trained on BooksCorpus and reports improved
  results over the previous state of the art on 9 of 12 natural-language tasks.
  Those benchmark results are the authors' own. OpenAI released the code and
  pretrained model with the paper. Its later GPT-2 work explicitly followed the
  original GPT model. The name "GPT-1" was applied later; the paper calls it a
  "Finetuned Transformer LM"{note: the announcement and paper do not use the name GPT-1}.
category: model release
