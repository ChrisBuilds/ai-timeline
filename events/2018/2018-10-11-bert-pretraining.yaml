id: 2018-10-11-bert-pretraining
title: Google researchers introduce BERT
date: "2018-10-11"
summary: >-
  Google researchers present BERT, a Transformer encoder pretrained with masked language modeling to
  learn bidirectional text representations, then fine-tuned for downstream tasks; the paper reports
  new results on eleven NLP benchmarks.
description: |
  BERT (Bidirectional Encoder Representations from Transformers) uses masked
  language modeling and a next sentence prediction task during pretraining. The
  authors fine-tuned the pretrained model for several language understanding
  tasks, reporting state-of-the-art results on eleven benchmarks, including GLUE,
  SQuAD and MultiNLI. The paper identifies its architecture as a multi-layer
  bidirectional Transformer encoder.
category: research
