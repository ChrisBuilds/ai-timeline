id: 2012-09-30-alexnet-imagenet
title: AlexNet wins ImageNet and starts the deep learning era
date: "2012-09-30"
summary: >-
  A GPU-trained convolutional network by Krizhevsky, Sutskever and Hinton wins the ImageNet 2012
  challenge with 15.3% top-5 error, more than 10 points ahead of the runner-up.
description: |
  The entry was submitted on September 30, 2012. Its margin over traditional
  computer vision methods convinced much of the field to switch to deep neural
  networks trained on GPUs.
category: research
