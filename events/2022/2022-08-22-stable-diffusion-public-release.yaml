id: 2022-08-22-stable-diffusion-public-release
title: Stable Diffusion weights are publicly released
date: "2022-08-22"
summary: >-
  Stability AI and collaborators made Stable Diffusion model weights publicly
  available, enabling local text-to-image generation. The weights were released
  under the CreativeML Open RAIL-M license, which permits broad use subject to
  stated use restrictions.
description: >-
  Stability AI announced the public release of Stable Diffusion on 22 August
  2022. The text-to-image model was developed with researchers associated with
  CompVis at LMU Munich and Runway. Releasing weights, code and documentation
  allowed users to run and adapt the model locally, including on consumer
  hardware, while the CreativeML Open RAIL-M license retained restrictions on
  certain uses; this was not an unrestricted public-domain release.
category: model release
