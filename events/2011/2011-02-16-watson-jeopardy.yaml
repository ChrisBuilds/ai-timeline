id: 2011-02-16-watson-jeopardy
title: IBM Watson wins Jeopardy!
date: "2011-02-16"
summary: >-
  IBM's Watson question-answering system defeated former Jeopardy! champions
  Ken Jennings and Brad Rutter in the final televised match of a three-day
  competition.
description: |
  The two-game match aired February 14–16, 2011. On the final episode, Watson
  finished with $77,147, ahead of Jennings at $24,000 and Rutter at $21,600.
  The result demonstrated a question-answering system competing with top human
  players on a fast-paced television quiz show and brought AI to a broad
  audience.
