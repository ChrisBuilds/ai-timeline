id: 2021-01-05-openai-dall-e
title: OpenAI introduces the DALL·E research model
date: "2021-01-05"
summary: >-
  OpenAI published examples of DALL·E, a 12-billion-parameter GPT-3 variant that generated images
  from text by modeling text and image tokens in one stream.
description: >-
  OpenAI's announcement describes DALL·E as a 12-billion-parameter version of GPT-3 trained to
  generate images from text captions. A single transformer models text and image tokens as one
  stream, with images compressed by a discrete variational autoencoder. OpenAI's examples included
  combining unrelated concepts, rendering text and transforming existing images, and the post notes
  that controllability weakens as more objects are added. Sample images were reranked with CLIP,
  announced the same day. The announcement presents these as OpenAI's research results. OpenAI
  posted the accompanying paper, "Zero-Shot Text-to-Image Generation", to arXiv on 24 February
  2021. The full 12-billion-parameter transformer was not released; OpenAI later released code and
  weights for the dVAE image-tokenizer component, explicitly excluding that transformer. An
  independent developer later said DALL·E inspired DALL·E Mini, a separate system. This entry does
  not attribute the use of that or later image-generation products to the original model.
