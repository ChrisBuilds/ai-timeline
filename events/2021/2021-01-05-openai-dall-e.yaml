id: 2021-01-05-openai-dall-e
title: OpenAI introduces DALL·E
date: "2021-01-05"
summary: >-
  OpenAI announced DALL·E, a 12-billion-parameter transformer that generates images from text
  descriptions, as a research result without a public image-generation service.
description: >-
  OpenAI's announcement describes DALL·E as a 12-billion-parameter version of GPT-3 trained to
  generate images from text captions. A single transformer models text and image tokens as one
  stream, with images compressed by a discrete variational autoencoder. OpenAI's examples included
  combining unrelated concepts, rendering text and transforming existing images, and the post notes
  that controllability weakens as more objects are added. Sample images were reranked with CLIP,
  announced the same day. The post presents these as OpenAI's own results and does not describe a
  public release or API; the accompanying paper, "Zero-Shot Text-to-Image Generation", was posted to
  arXiv on 24 February 2021. The successor DALL·E 2 is mentioned by OpenAI as producing more
  realistic images at higher resolution.{note: This entry records the research announcement only.
  Comparisons with earlier text-to-image systems are OpenAI's own claims.}
