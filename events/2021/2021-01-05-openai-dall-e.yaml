importance:
  current: 2026-11-06-v2
  assessments:
    - id: 2026-11-06-v2
      assessed_at: 2026-11-06
      rubric_version: v2
      status: provisional
      reviewer: Codex (research assessment, pending maintainer review)
      rationale: This provisional assessment covers the research model and its documented follow-on
        influence only. It separates the unpublished 12-billion-parameter transformer from the
        released dVAE component and later public systems. The launch is notable for demonstrating
        large-scale autoregressive text-to-image generation, but evidence does not establish that
        it redirected the field or had broad societal effects on its own.
      dimensions:
        influence:
          rating: 2
          confidence: medium
          rationale: >-
            The work had meaningful niche influence: GLIDE compared its system directly
            with DALL·E, and the creator of DALL·E Mini said the original paper inspired his
            independent prototype. This does not establish that later text-to-image systems broadly
            derived from DALL·E.
          evidence:
            - https://arxiv.org/abs/2112.10741
            - https://www.wired.com/story/dalle-ai-meme-machine/
        adoption:
          rating: 1
          confidence: medium
          rationale: OpenAI trained and demonstrated the model as an isolated research prototype.
            There is no evidence that others could use the 12-billion-parameter transformer; its
            code release excluded the transformer and covered only the dVAE component.
          evidence:
            - https://openai.com/index/dall-e/
            - https://github.com/openai/DALL-E
        capability:
          rating: 3
          confidence: medium
          rationale: Demonstrated a substantial new practical and conceptual ability by generating
            varied images from natural-language prompts with one autoregressive transformer over
            text and image tokens. The examples were selected by OpenAI, and controllability had
            stated limits.
          evidence:
            - https://openai.com/index/dall-e/
            - https://arxiv.org/abs/2102.12092
        society:
          rating: 1
          confidence: medium
          rationale: The research announcement received local public and press attention, but the
            evidence reviewed does not show broad or sustained societal effects from this
            unreleased model.
          evidence:
            - https://openai.com/index/dall-e/
            - https://www.axios.com/2021/01/05/openai-artificial-intelligence-model-images-dall-e
      comparisons:
        - id: 2022-08-22-stable-diffusion-public-release
          rationale: "Lower overall significance under v2. This event: demonstrated a closed research
            prototype with limited evidence of external use. Comparison event: public model weights
            enabled broad local experimentation and deployment."
        - id: 2020-05-28-gpt3-few-shot-learners
          rationale: "Lower overall significance under v2. This event: demonstrated a new image-generation
            application of autoregressive language modeling. Comparison event: established a much
            broader field-level direction in language modeling."
      questions:
        - What additional independent systems or research works directly attribute their methods to
          the original DALL·E?
      review_after: 2026-12-06
      review_triggers:
        - New attributable evidence of influence or use of the original model, or a separate event
          for a later DALL·E system.
