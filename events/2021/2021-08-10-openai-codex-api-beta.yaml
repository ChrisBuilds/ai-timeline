id: 2021-08-10-openai-codex-api-beta
title: OpenAI opens Codex to developers through a private API beta
date: "2021-08-10"
summary: >-
  OpenAI began a private API beta for an improved Codex model that translated natural-language
  instructions into code.
description: >-
  OpenAI invited selected businesses and developers to try an improved Codex model through its API
  and build applications with it. The API version could turn plain-language requests into code in
  more than a dozen programming languages. Access began as a free, application-reviewed private
  beta. OpenAI later deprecated the original Codex API model IDs in March 2023; this is separate from
  the newer Codex coding-agent products. This is the API access milestone, separate from the Codex
  research paper published in July 2021 and GitHub Copilot's June 2021 technical preview, which used
  a distinct production version of Codex.
category: model release
