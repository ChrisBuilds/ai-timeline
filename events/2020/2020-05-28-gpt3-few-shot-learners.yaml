id: 2020-05-28-gpt3-few-shot-learners
title: OpenAI researchers publish GPT-3 few-shot learning results
date: "2020-05-28"
summary: >-
  Brown and colleagues describe GPT-3, a 175-billion-parameter language model
  that performs a range of tasks from examples or instructions in its prompt,
  without gradient updates at inference time.
description: >-
  The paper "Language Models are Few-Shot Learners" evaluates GPT-3 in zero-shot,
  one-shot and few-shot settings. Its results show that scaling the model can
  improve in-context task performance, though performance varies by task and
  does not remove the need for fine-tuning or task-specific systems in every
  application. This event records the paper's public posting, not the later
  GPT-3 API beta.
