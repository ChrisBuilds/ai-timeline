id: 1997-05-11-deep-blue-defeats-kasparov
title: IBM's Deep Blue defeats world chess champion Garry Kasparov
date: "1997-05-11"
summary: >-
  Deep Blue wins the sixth and final game of their rematch in New York, beating Kasparov 3½–2½, the
  first match loss by a reigning world champion to a computer.
category: benchmark milestone
