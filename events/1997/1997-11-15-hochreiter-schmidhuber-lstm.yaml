id: 1997-11-15-hochreiter-schmidhuber-lstm
title: Hochreiter and Schmidhuber publish their LSTM paper
date: "1997-11-15"
summary: >-
  Sepp Hochreiter and Jürgen Schmidhuber publish a journal account of long short-term memory, a
  recurrent network architecture designed to learn across long time gaps.
description: |
  *Neural Computation* published Hochreiter and Schmidhuber's paper on 15
  November 1997. It describes a recurrent architecture with memory units and
  multiplicative gates, designed to preserve error flow across long sequence
  gaps. In artificial-data experiments, the authors reported learning tasks
  with time lags exceeding 1,000 steps. This was the journal publication, not
  the first appearance of LSTM: the paper cites the authors' 1995 technical
  report and conference work presented in 1996.

  LSTMs later became a major approach to sequence modeling. In 2014, Sutskever,
  Vinyals and Le used stacked LSTMs for English-to-French sequence-to-sequence
  translation, outperforming a phrase-based system on the WMT 2014 test set.
  The Transformer paper in 2017 described recurrent networks as common in
  sequence transduction and replaced recurrent layers with self-attention for
  its translation model; this marks a shift in machine translation, not the
  disappearance of LSTMs from every application.
