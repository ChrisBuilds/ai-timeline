id: 2015-12-11-openai-founded
title: OpenAI announces its founding as a nonprofit
date: "2015-12-11"
summary: >-
  OpenAI announced a nonprofit research organization intended to advance digital
  intelligence for broad human benefit, with founders pledging up to $1 billion
