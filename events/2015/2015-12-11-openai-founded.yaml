description: >-
  OpenAI announced its formation as a nonprofit AI research organization. The
  announcement described a mission to advance digital intelligence for the
  benefit of humanity and said the founders had committed up to $1 billion over
  the first years. This records the public announcement; it does not assert the
  legal incorporation date.
