id: 2006-07-deep-belief-net-training
title: Hinton, Osindero and Teh publish a deep-belief-net algorithm
date: "2006-07"
summary: >-
  Geoffrey Hinton, Simon Osindero and Yee-Whye Teh present a greedy layer-by-layer method for
  training deep belief networks and report results on handwritten digits.
description: |
  In *Neural Computation* 18(7), Hinton, Osindero and Teh described a fast,
  greedy procedure for learning a deep belief network one layer at a time.
  The top two layers form an undirected associative memory; the remaining
  layers form a directed network. They used the learned weights to initialize
  a fine-tuning procedure. On handwritten digit images, a network with three
  hidden layers achieved 1.25% error on a 10,000-image test set, compared with
  1.5% for the best backpropagation networks in the authors' stated comparison.

  Later histories place this paper among the work marking the third wave of
  deep learning, beginning around 2006. They also identify other contributions
  from this period, so this paper was one part of the resurgence rather than
  its sole starting point.
