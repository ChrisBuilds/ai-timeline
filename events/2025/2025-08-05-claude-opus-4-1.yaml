id: 2025-08-05-claude-opus-4-1
title: Anthropic releases Claude Opus 4.1
date: 2025-08-05
summary: Anthropic released Claude Opus 4.1, an incremental update to Opus 4 with improvements in coding, reasoning, and agentic tasks.
description: >-
  Anthropic made Claude Opus 4.1 available to paid Claude users, Claude Code, its API,
  Amazon Bedrock, and Google Cloud Vertex AI. The company described it as an upgrade
  to Opus 4 for agentic tasks, real-world coding, and reasoning, and reported 74.5%
  on SWE-bench Verified. In its system-card addendum, Anthropic characterized the
  improvements as incremental and said the model did not meet its threshold for a
  notably more capable model relative to Opus 4. Benchmark results and descriptions
  of performance are Anthropic's reports.
