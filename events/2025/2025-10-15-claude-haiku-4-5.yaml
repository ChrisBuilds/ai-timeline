id: 2025-10-15-claude-haiku-4-5
title: Anthropic releases Claude Haiku 4.5
date: 2025-10-15
summary: Anthropic released Claude Haiku 4.5, a lower-cost model for chat and coding that it described as approaching the coding performance of Sonnet 4.
description: >-
  Anthropic made Claude Haiku 4.5 available through Claude, its API, Amazon Bedrock,
  Google Cloud Vertex AI, and Claude Code. The company described the model as
  offering coding performance similar to Sonnet 4 at lower cost and latency; these
  comparisons are Anthropic's reported evaluations. GitHub began a public preview
  in Copilot on the same date and made the model generally available across supported
  Copilot plans and IDEs five days later. A 2026 independent study evaluated Haiku 4.5
  on generated Java service methods, but its single-run, constrained setup does not
  establish broad adoption or downstream effects.
