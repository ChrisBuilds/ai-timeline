id: 2025-11-24-claude-opus-4-5
title: Anthropic releases Claude Opus 4.5
date: 2025-11-24
summary: Anthropic released Claude Opus 4.5, a model update for coding, agent tasks, computer use, and general work.
description: >-
  Anthropic made Opus 4.5 available through its apps, API, and major cloud
  platforms. Its system card reports results on coding benchmarks. METR later
  estimated a 320-minute 50% task-completion horizon (95% interval: 170–729
  minutes) on its software and research task suite; METR cautions that the
  estimate is imprecise and the suite is approaching saturation. This supports
  stronger performance on that task distribution, not a general measure of
  workplace productivity. Anthropic's later Economic Index reports use of the
  Opus model class, but does not isolate Opus 4.5's adoption.
category: model release
tags:
  - language model
  - coding
  - reasoning
  - agents
  - computer use
organizations:
  - Anthropic
