id: 2025-01-20-deepseek-r1
title: DeepSeek releases R1 as an open reasoning model
date: "2025-01-20"
summary: >-
  Chinese lab DeepSeek released DeepSeek-R1, a reasoning model it reported as on par with OpenAI's
  o1, with open weights under the MIT licence; a week later Nvidia lost nearly $600 billion in
  market value in a record one-day fall.
description: |
  DeepSeek-R1 is a mixture-of-experts model with 671 billion total and 37 billion
  activated parameters. Its technical report, posted to arXiv on January 22, 2025,
  describes developing reasoning ability largely through reinforcement learning, and
  the release included R1-Zero, trained with reinforcement learning alone, and six
  smaller models distilled from R1. The report was later published in *Nature* on
  September 17, 2025.

  On January 27, 2025, Nvidia shares fell about 17% in a sell-off of AI-related
  stocks that Reuters and Bloomberg attributed to DeepSeek. Bloomberg put Nvidia's
  loss at $589 billion and Reuters at about $593 billion, the largest one-day loss
  in market value on record.
