id: 2025-09-29-claude-sonnet-4-5
title: Anthropic releases Claude Sonnet 4.5
date: 2025-09-29
summary: Anthropic released Claude Sonnet 4.5, a model update focused on coding, computer use, and complex agent tasks.
description: >-
  Anthropic released Sonnet 4.5 through Claude, its API, and developer products, reporting
  gains in coding, computer use, reasoning, and math. Its system card documents model
  evaluations, including coding and AI research tasks. METR independently estimated a
  122-minute 50% task-completion horizon for Sonnet 4.5 on its software, machine-learning,
  and cybersecurity task suite; the estimate had a wide 59-to-252-minute interval and is
  specific to that evaluation setup. GitHub later offered the model in Copilot, including
  its coding agent, establishing product availability but not the amount of resulting use.
  The announcement also introduced the Claude Agent SDK and upgrades to Claude Code as
  separate developer tools alongside the model.
