id: 2025-02-24-claude-3-7-sonnet
title: Anthropic releases Claude 3.7 Sonnet with extended thinking
date: "2025-02-24"
summary: >-
  Anthropic released Claude 3.7 Sonnet, combining standard responses with
  optional extended thinking in one model.
description: >-
  The model could respond in standard mode or spend additional inference time
  on visible, step-by-step thinking. API users could set a thinking-token
  budget. Claude 3.7 Sonnet was available across Anthropic plans and through
  its developer platform, Amazon Bedrock, and Google Cloud Vertex AI; extended
  thinking was unavailable on the free Claude tier. Claude Code was announced
  alongside it as a separate limited research preview.
category: model release
organizations: [Anthropic]
tags: [large language model, reasoning, extended thinking]
sources:
  - url: https://www.anthropic.com/news/claude-3-7-sonnet
    title: Claude 3.7 Sonnet and Claude Code
    publisher: Anthropic
    accessed: "2026-11-05"
