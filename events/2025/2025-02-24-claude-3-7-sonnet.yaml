      comparisons:
        - id: 2024-09-12-openai-o1
          rationale: >-
            Both releases make additional inference-time reasoning a selectable
            capability. Claude 3.7 Sonnet integrates standard and extended
            modes in one model; the o1 release introduced a separate reasoning
            model. Neither launch announcement alone establishes long-term
            adoption.
        - id: 2023-03-14-openai-gpt-4
          rationale: >-
            GPT-4 provides context for a broadly accessible frontier-model
            release emphasizing multimodal inputs and benchmark results.
            Claude 3.7 Sonnet's distinct contribution is configurable
            inference-time reasoning; the vendor's comparative results are
            not independent downstream-impact evidence.
      questions:
        - >-
          What independent longitudinal evidence establishes sustained use of
          extended thinking in this release?
        - >-
          How much later model design or developer practice can be attributed
          specifically to the hybrid reasoning approach?
      review_after: "2026-12-05"
      review_triggers:
        - >-
          Reassess when independent evidence documents sustained adoption,
          direct model-design successors, or changes to established practice.
