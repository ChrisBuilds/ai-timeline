name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Reads only .github/labeler.yml from the base branch; never runs PR code.
      - uses: actions/labeler@v5
