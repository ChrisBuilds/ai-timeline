name: Content checks

# Fast checks for event changes: schema, ids, related links, duplicates.
on:
  pull_request:
    paths: ['events/**', 'removed.yaml', 'schema/**', 'scripts/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
